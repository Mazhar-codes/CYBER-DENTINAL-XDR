<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{background:#04070d}
  .surf-card{
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(0,212,255,0.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(220,38,38,0.07), transparent 60%),
      linear-gradient(135deg, #0a1120 0%, #050b18 100%);
    border:1px solid rgba(59,130,246,0.18);
    border-radius:14px;
    padding:18px;
    box-shadow:0 0 40px rgba(0,212,255,0.08), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative; overflow:hidden;
  }
  .surf-card::before{
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(0,212,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 90%);
    pointer-events:none;
  }
  .surf-card::after{
    content:''; position:absolute; top:0; left:-100%; width:50%; height:1px;
    background:linear-gradient(90deg, transparent, #00d4ff, transparent);
    animation:scan 4s linear infinite;
  }
  @keyframes scan{0%{left:-50%}100%{left:100%}}
  .swatch-stack{display:flex;flex-direction:column;gap:7px;flex:1;position:relative;z-index:1}
  .sw{display:flex;align-items:center;gap:9px}
  .sw-chip{
    width:20px;height:20px;border-radius:5px;
    border:1px solid rgba(0,212,255,0.25);
    box-shadow:0 0 10px rgba(0,212,255,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    flex-shrink:0;
  }
  .sw-tok{font-family:'Fira Code',monospace;font-size:10px;color:#00d4ff;letter-spacing:0.5px;text-shadow:0 0 6px rgba(0,212,255,0.4)}
  .sw-name{font-family:'Fira Code',monospace;font-size:9px;color:#475569;letter-spacing:0.3px;margin-left:auto}
  .panel-demo{
    flex:1.3; height:108px; border-radius:10px;
    background:linear-gradient(135deg,#1e293b 0%,#162032 50%,#0d1629 100%);
    border:1px solid rgba(0,212,255,0.2);
    border-left:3px solid #00d4ff;
    padding:12px 14px;
    box-shadow:0 0 24px rgba(0,212,255,0.18), 0 4px 16px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    position:relative; overflow:hidden;
  }
  .panel-demo::before{
    content:''; position:absolute; top:-30px; right:-30px;
    width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle, rgba(0,212,255,0.25), transparent 70%);
  }
  .panel-eye{font-family:'Fira Code',monospace;font-size:9px;font-weight:700;letter-spacing:2px;color:#00d4ff;text-shadow:0 0 8px rgba(0,212,255,0.6)}
  .panel-title{font-size:20px;font-weight:800;margin-top:6px;color:#f1f5f9;letter-spacing:-0.3px}
  .panel-meta{font-family:'Fira Code',monospace;font-size:10px;color:#64748b;margin-top:6px;display:flex;gap:6px;align-items:center}
  .panel-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;animation:blink 1.5s ease-in-out infinite}
  @keyframes blink{50%{opacity:0.4}}
</style></head>
<body><div class="surf-card" style="display:flex;gap:14px">
  <div class="swatch-stack">
    <div class="sw"><span class="sw-chip" style="background:#0a1120"></span><span class="sw-tok">#0a1120</span><span class="sw-name">bg-app</span></div>
    <div class="sw"><span class="sw-chip" style="background:#050b18"></span><span class="sw-tok">#050b18</span><span class="sw-name">bg-deep</span></div>
    <div class="sw"><span class="sw-chip" style="background:linear-gradient(180deg,#0d1629,#0a1120)"></span><span class="sw-tok">sidebar</span><span class="sw-name">gradient</span></div>
  </div>
  <div class="swatch-stack">
    <div class="sw"><span class="sw-chip" style="background:linear-gradient(135deg,#1e293b,#162032)"></span><span class="sw-tok">panel</span><span class="sw-name">gradient</span></div>
    <div class="sw"><span class="sw-chip" style="background:#1e293b"></span><span class="sw-tok">#1e293b</span><span class="sw-name">row</span></div>
    <div class="sw"><span class="sw-chip" style="background:#192334"></span><span class="sw-tok">#192334</span><span class="sw-name">row-alt</span></div>
  </div>
  <div class="panel-demo">
    <div class="panel-eye">◈ PANEL · LIVE</div>
    <div class="panel-title">Threat surface</div>
    <div class="panel-meta"><span class="panel-dot"></span>monitoring · 1.2k flows/s</div>
  </div>
</div></body></html>
